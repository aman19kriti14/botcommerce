databaseChangeLog:
  - changeSet:
      id: 002-create-knowledge-sources
      author: aman
      changes:
        - createTable:
            tableName: knowledge_sources
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: merchant_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: merchants(id)
                    foreignKeyName: fk_ksource_merchant
              - column:
                  name: type
                  type: varchar(20)
                  constraints:
                    nullable: false
                  remarks: "file, website, text"
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: varchar(500)
              - column:
                  name: file_name
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: processing
                  remarks: "processing, ready, failed"
              - column:
                  name: content
                  type: text
              - column:
                  name: chunks_count
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: char_count
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: error_message
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
        - createIndex:
            tableName: knowledge_sources
            indexName: idx_ksource_merchant
            columns:
              - column: { name: merchant_id }